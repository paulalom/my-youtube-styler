<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My YouTube Styler</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="header">
      <img class="header__icon" src="icons/icon-48.png" alt="">
      <div>
        <h1>My YouTube Styler</h1>
        <p>
          <span>Home and Subscriptions tweaks</span>
          <span class="version-badge" id="extension-version"></span>
        </p>
      </div>
    </header>

    <main class="settings" aria-label="Styler settings">
      <label class="setting">
        <span class="setting__text">
          <strong>Compact thumbnails, icons, and text</strong>
          <small>Use 6 per row with smaller avatars, titles, and metadata.</small>
        </span>
        <input type="checkbox" data-setting="compactLayout">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Color views and age</strong>
          <small>Show high-view and newer videos as green, fading toward red for low-view and older videos.</small>
        </span>
        <input type="checkbox" data-setting="colorVideoMetadata">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Hide paid/member videos</strong>
          <small>Hide common Premium, member-only, buy, rent, and purchase badges.</small>
        </span>
        <input type="checkbox" data-setting="hidePaidVideos">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Open video from thumbnail clicks</strong>
          <small>Route clicks anywhere on a video thumbnail, including paid-promotion overlays, to the video.</small>
        </span>
        <input type="checkbox" data-setting="openVideoOnThumbnailClick">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Hide Shorts</strong>
          <small>Remove Shorts shelves from feed pages.</small>
        </span>
        <input type="checkbox" data-setting="hideShorts">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Hide You might like</strong>
          <small>Remove recommendation nudge sections from feed pages.</small>
        </span>
        <input type="checkbox" data-setting="hideYouMightLike">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Hide Explore more topics</strong>
          <small>Remove topic-picker sections from feed pages.</small>
        </span>
        <input type="checkbox" data-setting="hideExploreMoreTopics">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Hide YouTube featured shelves</strong>
          <small>Remove featured brand video shelves from feed pages.</small>
        </span>
        <input type="checkbox" data-setting="hideFeaturedShelves">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Hide playlists</strong>
          <small>Remove playlist cards and playlist shelves from feed pages.</small>
        </span>
        <input type="checkbox" data-setting="hidePlaylists">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Hide Playables</strong>
          <small>Remove Playables game cards and shelves from feed pages.</small>
        </span>
        <input type="checkbox" data-setting="hidePlayables">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Hide subscription sort controls</strong>
          <small>Remove Latest and Most relevant from Subscriptions.</small>
        </span>
        <input type="checkbox" data-setting="hideSubscriptionSortControls">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Hide miniplayer</strong>
          <small>Remove YouTube's bottom-right miniplayer.</small>
        </span>
        <input type="checkbox" data-setting="hideMiniplayer">
      </label>

      <label class="setting">
        <span class="setting__text">
          <strong>Auto-remember seen feed videos</strong>
          <small>Hide videos you saw on Home or Subscriptions for 7 days after the next feed load or refresh.</small>
        </span>
        <input type="checkbox" data-setting="rememberSeenVideos">
      </label>

      <div class="setting setting--action">
        <span class="setting__text">
          <strong>Auto seen history</strong>
          <small id="clear-history-status">Auto history expires after 7 days and is never uploaded anywhere.</small>
        </span>
        <button class="action-button" id="clear-history" type="button">Clear</button>
      </div>

      <div class="setting setting--action">
        <span class="setting__text">
          <strong>Local not interested videos</strong>
          <small id="clear-not-interested-status">Alt+click a feed video to hide it locally; no feedback is sent to YouTube.</small>
        </span>
        <button class="action-button" id="clear-not-interested" type="button">Clear</button>
      </div>

      <div class="setting setting--action">
        <span class="setting__text">
          <strong>Inline filters</strong>
          <small id="reset-filters-status">Reset date and view filters to All.</small>
        </span>
        <button class="action-button action-button--secondary" id="reset-filters" type="button">Reset</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
